name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android-and-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=4
        working-directory: android-app
      - run: bash scripts/ios/test-battery-hysteresis.sh
      - run: python3 scripts/check-public-source.py
  ios-model:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcrun clang++ -fobjc-arc -std=c++17 -framework Foundation \
            ios-app/MinerConfiguration.mm ios-app/tests/ConfigurationTests.mm \
            -o /tmp/xmrand-config-tests
          /tmp/xmrand-config-tests
